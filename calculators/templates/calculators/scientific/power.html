{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
    {% load static %}

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Power & Exponent Calculator | CalcVerse</title>

    <link rel="stylesheet" href="{% static 'calculators/css/calculator.css' %}">
</head>

<body>

<header class="navbar">
    <a href="/" class="logo">Calc<span>Verse</span></a>

    <nav>
        <a href="/">Home</a>
        <a href="/category/scientific/">Scientific</a>
    </nav>
</header>


<main class="tool-container">

    <div class="tool-hero">
        <span class="hero-badge">SCIENTIFIC TOOL</span>

        <h1>Power & <span>Exponent</span></h1>

        <p>Calculate the power of any number instantly.</p>
    </div>


    <div class="tool-card">

        <div class="input-group">
            <label for="base">Base Number</label>
            <input type="number" id="base" placeholder="Enter base number">
        </div>

        <div class="input-group">
            <label for="exponent">Exponent</label>
            <input type="number" id="exponent" placeholder="Enter exponent">
        </div>

        <button class="calculate-btn" onclick="calculatePower()">
            Calculate
        </button>


        <div class="result-box">
            <span>Result</span>
            <strong id="result">—</strong>
        </div>

    </div>

</main>


<script>
    function calculatePower() {
        const base = parseFloat(document.getElementById("base").value);
        const exponent = parseFloat(document.getElementById("exponent").value);
        const result = document.getElementById("result");

        if (isNaN(base) || isNaN(exponent)) {
            result.textContent = "Please enter both values";
            return;
        }

        result.textContent = Math.pow(base, exponent);
    }
</script>

</body>
</html>
