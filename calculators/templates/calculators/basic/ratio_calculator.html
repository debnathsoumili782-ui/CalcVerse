{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Ratio Calculator | CalcVerse</title>

    <link rel="stylesheet" href="{% static 'calculators/css/calculator.css' %}">
</head>

<body>

<header class="navbar">
    <a href="/" class="logo">Calc<span>Verse</span></a>

    <nav>
        <a href="/">Home</a>
        <a href="/category/basic/">Basic Calculators</a>
    </nav>
</header>


<main class="calculator-page">

    <div class="calculator-header">
        <div class="badge">RATIO CALCULATOR</div>

        <h1>Simplify Your <span>Ratio.</span></h1>

        <p>Enter two numbers to simplify their ratio instantly.</p>
    </div>


    <div class="ratio-box">

        <div class="ratio-inputs">

            <div class="ratio-field">
                <label for="ratio-a">First Number</label>
                <input type="number" id="ratio-a" placeholder="e.g. 20">
            </div>

            <div class="ratio-symbol">:</div>

            <div class="ratio-field">
                <label for="ratio-b">Second Number</label>
                <input type="number" id="ratio-b" placeholder="e.g. 30">
            </div>

        </div>

        <button onclick="calculateRatio()" class="ratio-btn">
            Simplify Ratio
        </button>


        <div class="ratio-result">

            <span>Simplified Ratio</span>
            <strong id="ratio-output">—</strong>

        </div>

    </div>

</main>


<footer>
    © 2026 CalcVerse — Calculate Smarter.
</footer>


<script>
    function gcd(a, b) {
        a = Math.abs(a);
        b = Math.abs(b);

        while (b !== 0) {
            let temp = b;
            b = a % b;
            a = temp;
        }

        return a;
    }


    function calculateRatio() {
        const a = parseFloat(document.getElementById("ratio-a").value);
        const b = parseFloat(document.getElementById("ratio-b").value);

        const output = document.getElementById("ratio-output");

        if (isNaN(a) || isNaN(b) || a <= 0 || b <= 0) {
            output.textContent = "Invalid";
            return;
        }

        /* Ratio simplification works properly with whole numbers */
        if (!Number.isInteger(a) || !Number.isInteger(b)) {
            output.textContent = "Use whole numbers";
            return;
        }

        const divisor = gcd(a, b);

        output.textContent = `${a / divisor} : ${b / divisor}`;
    }
</script>

</body>
</html>
